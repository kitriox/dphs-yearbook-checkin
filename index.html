<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPHS Yearbook — Staff Check-In</title>
<style>
  body { margin: 0; background: #f3f6fa; color: #5b6577; font: 16px/1.45 system-ui, sans-serif; }
  .boot { text-align: center; padding: 80px 16px; }
  .spin { width: 28px; height: 28px; border: 3px solid #DCEAF5; border-top-color: #0B1F4B; border-radius: 50%;
          margin: 0 auto 12px; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="boot" id="boot"><div class="spin"></div>Loading Staff Check-In…</div>
<script>
/*
 * DPHS Yearbook Check-In — outside host.
 * The page itself still lives in the Apps Script project (Index.html). This loader pulls it
 * and talks to the script WITHOUT Google sign-in cookies, so it works no matter how many
 * Google accounts a student is signed into.
 */
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbyPmRTGRAEEgL7jMPsQ92pyzplhAXTrCNM0g_UBBbAq9yxqEcatdQGfMmD-Wg5dQIhIGw/exec';

  // Stand-in for google.script.run that calls the script's doPost JSON API.
  function runner(ok, fail) {
    var target = {
      withSuccessHandler: function (f) { return runner(f, fail); },
      withFailureHandler: function (f) { return runner(ok, f); }
    };
    return new Proxy(target, {
      get: function (t, fn) {
        if (fn in t) return t[fn];
        return function () {
          var args = Array.prototype.slice.call(arguments);
          fetch(API, {
            method: 'POST',
            credentials: 'omit',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ fn: fn, args: args })
          }).then(function (r) { return r.json(); }).then(function (res) {
            if (res.ok) { if (ok) ok(res.result); }
            else if (fail) fail(new Error(res.error));
          }).catch(function () {
            if (fail) fail(new Error('Could not reach the yearbook server. Check your Wi-Fi and try again.'));
          });
        };
      }
    });
  }
  window.google = { script: { run: runner(null, null) } };

  fetch(API + '?src=1', { credentials: 'omit' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) {
      if (html.indexOf('id="app"') < 0) throw new Error('bad page');
      html = html.replace('<base target="_top">', '');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function () {
      document.getElementById('boot').innerHTML =
        '<b style="color:#0B1F4B">Couldn\'t load the check-in.</b><br>Check your Wi-Fi and refresh the page.';
    });
})();
</script>
</body>
</html>
